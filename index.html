<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Quantum Trace - Space Journey</title>
  <link rel="stylesheet" href="test.css">
</head>
<body>

  <!-- JOURNEY MAP VIEW -->
  <div id="map-screen" class="screen">
    <div class="hud map-hud">
      <h1>Pixel Quantum Trace</h1>
      <div id="total-stars">Total Stars: ⭐ 0</div>
    </div>

    <div class="map-container">
      <canvas id="map-canvas" width="380" height="520"></canvas>
    </div>
  </div>

  <!-- PUZZLE GRID VIEW -->
  <div id="game-screen" class="screen" style="display: none;">
    <div class="hud">
      <button id="map-back-btn" class="nav-btn">⬅ Map</button>
      <h1 id="level-title">Level 1.1</h1>
      <div id="attempts-left">Energy Shots: ⚡⚡⚡</div>
    </div>

    <div class="game-layout">
      <canvas id="game" width="240" height="240"></canvas>
      <button id="fire-btn">Shoot Laser ⚡</button>
    </div>

    <div id="status">Plan your mirrors and click Shoot Laser</div>

    <div class="bottom-btn-group">
      <button id="restart-btn">Restart Sub-Level</button>
      <button id="next-btn" disabled>Next Stage ➔</button>
    </div>
  </div>

  <script src="test.js"></script>
</body>
</html>
