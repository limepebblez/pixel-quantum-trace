<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Quantum Trace</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hud">
    <h1>Pixel Quantum Trace</h1>
    <div id="stage-info">Level 1</div>
  </div>

  <div class="game-layout">
    <canvas id="game" width="240" height="240"></canvas>
    <button id="fire-btn">Shoot Laser ⚡</button>
  </div>

  <div id="status">Plan your mirrors and click Shoot Laser</div>

  <div class="bottom-btn-group">
    <button id="restart-btn">Restart</button>
    <button id="next-btn" disabled>Level 2 ➔</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
